<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="register-page.css">
</head>
<body>
  <div class="hero">
    <nav class="navbar navbar-expand-sm bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">SafeHer</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="#features">Features</a>
        <a class="nav-link" href="#pricing">Pricing</a>
      </div>
    </div>
  </div>
</nav>
    <div class="register-container">
      <div class="register-card">
        <h1>💜 SafeHer</h1>
        <h2>Create your account</h2>
        <p>Join our community and take control of your safety. Sign up now to access our features and resources.</p>

        <form>
          <label>Full Name :</label>
          <input type="text" placeholder="Enter your name">

          <label>Email Address</label>
          <input type="email" placeholder="Enter your email address">

          <label>Phone Number</label>
          <input type="tel" placeholder="Enter your phone number">

          <label>Password</label>
          <input type="password" placeholder="Create a password">

          <label>Confirm Password</label>
          <input type="password" placeholder="Confirm your password">

          <button type="submit">Create Account →</button>
        </form>

        <p>Already have an account?
          <a routerLink="login_page">Log in</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
